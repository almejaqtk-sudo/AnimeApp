name: Compilar APK Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor y generar proyecto Android
        run: |
          npm install
          npx cap init "AnimeAV1" "com.animeav1.app" --web-dir="www"
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.animeav1.app",
            "appName": "AnimeAV1",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK Debug instalable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAV1-App-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
